---
layout: default
---
<article>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
      {% include meta-terms.html post=page %}
    </div>
  </header>
  <div class="content post-body">
    {{ content }}
  </div>
  <p class="post-footer"><a href="{{ '/posts/' | relative_url }}">← Posts</a></p>
</article>
{% include mathjax_support.html %}
