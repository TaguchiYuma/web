---
layout: default
---
<article>
  <header class="page-hero">
    <div class="wrap">
      <h1>{{ page.title }}</h1>
      <div class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
        {% include meta-terms.html post=page %}
      </div>
    </div>
  </header>
  <div class="wrap content post-body">
    {{ content }}
    <p class="post-footer"><a href="{{ '/posts/' | relative_url }}">← Posts</a></p>
  </div>
</article>
{% include mathjax_support.html %}
