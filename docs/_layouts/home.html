---
layout: default
---
<section class="profile">
  <img src="{{ page.photo | relative_url }}" alt="{{ site.author }}">
  <div>
    <h1>{{ page.fullname }}</h1>
    {% if page.affiliation %}<p class="affiliation">{{ page.affiliation }}</p>{% endif %}
    <ul class="links">
      {% for link in page.links %}<li><a href="{{ link.url }}">{{ link.name }}</a></li>{% endfor %}
    </ul>
  </div>
</section>

<div class="content">
  {{ content }}
</div>
