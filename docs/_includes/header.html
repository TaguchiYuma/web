<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top p-2">
    <div class="container">
      {% if page.lang == "en" %}
        <a class="navbar-brand" href="{{ '/en/' | relative_url }}"><b>{{ site.title }}</b></a>
      {% else %}
        <a class="navbar-brand" href="{{ '/' | relative_url }}"><b>{{ site.title }}</b></a>
      {% endif %}

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarColor03" aria-controls="navbarColor03" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarColor03">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
          </li>
        </ul>
        <ul class="navbar-nav">
          {% if page.translation %}
          <li class="nav-item">
            <a class="nav-link" href="{{ page.translation | relative_url }}">
              En⇄Ja
            </a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
</header>
