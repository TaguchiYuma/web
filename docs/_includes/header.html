<header class="site-header">
  <div class="wrap">
    <a class="site-title" href="{% if page.lang == "en" %}{{ '/en/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">{{ site.title }}</a>
    <nav class="site-nav">
      {% if page.translation %}
        <a href="{{ page.translation | relative_url }}">{% if page.lang == "en" %}日本語{% else %}English{% endif %}</a>
      {% endif %}
    </nav>
  </div>
</header>
