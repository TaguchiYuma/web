<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 140 }}">
<link rel="icon" type="image/png" href="{{ '/images/giraffe.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/giraffe.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% feed_meta %}
</head>
